<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>The Procedural Art Demo</title>
<style>
  html, body { margin: 0; height: 100%; background: #14201a; overflow: hidden; overscroll-behavior: none; }
  canvas { display: block; width: 100vw; height: 100vh; height: 100dvh; image-rendering: pixelated; touch-action: none; cursor: grab; }
  canvas.drag { cursor: grabbing; }
  .bar { position: fixed; left: 0; right: 0; box-sizing: border-box; display: flex; gap: 4px; padding: 6px max(8px, env(safe-area-inset-left));
         background: #2a1c3e; color: #f4efe6; font: 600 13px/1.1 ui-monospace, Menlo, monospace; user-select: none; -webkit-user-select: none; }
  #top { top: 0; align-items: center; justify-content: space-between; height: 44px; border-bottom: 2px solid #14101c; }
  #bottom { bottom: 0; padding-bottom: max(6px, env(safe-area-inset-bottom)); border-top: 2px solid #14101c; }
  .rows { display: flex; gap: 14px; white-space: nowrap; }
    .group { display: flex; gap: 4px; }
  .gone { display: none !important; }
  #tools { flex: 1; }
  #styles { flex: 0 0 auto; }
  #styles .btn { flex: 0 0 auto; min-width: 60px; padding: 4px 6px; }
  #tray { bottom: 58px; border-top: 2px solid #14101c; border-bottom: 0; }
  #tray .btn { flex: 0 1 auto; min-width: 92px; min-height: 36px; flex-direction: row; gap: 6px; padding: 4px 10px; }
  #tray .btn.once { margin-left: 12px; }
  #topright { align-items: center; }
  .btn.grey { opacity: 0.45; }
  .btn { flex: 1 1 0; min-width: 0; min-height: 44px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px;
         padding: 4px 2px; margin: 0; background: #3d2f55; color: inherit; font: inherit; border: 2px solid #14101c; border-radius: 4px; cursor: pointer;
         touch-action: manipulation; text-align: center; }
  #speeds .btn, #topright > .btn { flex: 0 0 auto; min-width: 54px; padding: 4px 8px; min-height: 32px; flex-direction: row; gap: 6px; }
  .btn.on { background: #54426f; border-color: #f2c230; }
  .lamp { width: 10px; height: 10px; border-radius: 50%; background: #1c1428; border: 1px solid #14101c; flex: none; }
  .btn.on .lamp { background: #f2c230; box-shadow: 0 0 6px #f2c230; }
  .btn.switch .lamp { background: #1c1428; }
  .btn.switch.on { border-color: #5fd068; }
  .btn.switch.on .lamp { background: #5fd068; box-shadow: 0 0 6px #5fd068; }
  .label { display: block; }
  #panel { position: fixed; right: 8px; top: 52px; box-sizing: border-box; max-width: calc(100vw - 16px); padding: 8px; display: flex; flex-direction: column; gap: 6px;
           background: #2a1c3e; color: #f4efe6; border: 2px solid #14101c; border-radius: 4px; font: 600 13px/1.1 ui-monospace, Menlo, monospace; }
  #panel .row { display: flex; align-items: center; gap: 8px; }
  #panel .btn { flex: 0 0 auto; min-width: 44px; min-height: 32px; flex-direction: row; gap: 5px; padding: 4px 8px; }
  #panel .actions { gap: 6px; flex-wrap: wrap; }
  #panel .stat { white-space: nowrap; }
  .wpanel { position: fixed; z-index: 6; left: 8px; top: 52px; box-sizing: border-box; width: 292px; max-width: calc(100vw - 16px); max-height: calc(100vh - 130px); overflow-y: auto;
            padding: 8px; display: flex; flex-direction: column; gap: 5px; background: #2a1c3e; color: #f4efe6; border: 2px solid #14101c; border-radius: 4px;
            font: 600 13px/1.15 ui-monospace, Menlo, monospace; }
  .wpanel .row { display: flex; align-items: center; gap: 6px; }
  .wpanel .actions { flex-wrap: wrap; }
  .wpanel .btn { flex: 0 0 auto; min-width: 44px; min-height: 32px; flex-direction: row; gap: 5px; padding: 4px 8px; }
  .wpanel .stat, .wpanel .wnext { white-space: nowrap; }
  .wpanel .wnext { color: #cdbfe6; padding-left: 12px; }
  .wpanel .wrule { color: #cdbfe6; font-weight: 400; line-height: 1.3; }
  .wlist { display: flex; flex-direction: column; gap: 3px; }
  .wrow { display: flex; align-items: center; gap: 8px; }
  .wname { flex: 1 1 auto; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .wrow .wbar { flex: 0 0 64px; }
  .wbar { height: 5px; background: #14101c; border-radius: 2px; overflow: hidden; }
  .wfill { height: 100%; width: 0; background: #5fd068; }
  #tip { position: fixed; z-index: 5; left: 50%; transform: translateX(-50%); bottom: 82px; max-width: calc(100vw - 32px); box-sizing: border-box; padding: 6px 12px;
         background: #f4efe6; color: #2a1c3e; border: 2px solid #2a1c3e; border-radius: 4px; font: 600 14px/1.3 ui-monospace, Menlo, monospace;
         text-align: center; pointer-events: none; }
  body.tray-open #tip { bottom: 128px; }
  #tip.no { background: #f6d9d6; border-color: #8c2a2a; color: #5c1414; }
  #tip.gone { display: none; }
  #line { position: fixed; left: 50%; top: 58px; transform: translateX(-50%); max-width: calc(100vw - 32px); box-sizing: border-box;
          padding: 8px 14px; background: #f4efe6; color: #2a1c3e; border: 2px solid #2a1c3e; border-radius: 4px;
          font: 600 15px/1.35 ui-monospace, Menlo, monospace; text-align: center; pointer-events: none; }
  #line.gone { display: none; }
  #stats { position: fixed; left: 8px; bottom: 90px; margin: 0; padding: 4px 8px; background: rgba(20, 18, 28, 0.82); color: #f4efe6;
           font: 12px/1.35 ui-monospace, Menlo, monospace; border-radius: 3px; white-space: pre; pointer-events: none; display: none; }
  #stats.on { display: block; }
  @media (max-width: 600px) {
    .bar { font-size: 12px; }
    .rows { gap: 10px; }
    #top .rows { flex-direction: column; gap: 1px; }
    #speeds .btn { min-width: 44px; padding: 4px 6px; }
    #bottom { flex-wrap: wrap; }
    #tools { flex: 1 0 100%; }
    #styles { flex: 1 1 auto; }
    #styles .btn { flex: 1 1 0; min-width: 0; }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="top" class="bar"><div class="rows"><span id="money"></span><span id="guests"></span><span id="drawing" class="gone"></span></div><div id="topright" class="group"><div id="speeds" class="group"></div></div></div>
<div id="line"></div>
<div id="tip" class="gone"></div>
<div id="tray" class="bar gone"></div>
<div id="panel" class="gone"></div>
<div id="bottom" class="bar"><div id="tools" class="group"></div><div id="styles" class="group"></div></div>
<pre id="stats"></pre>
<script type="module" src="main.js"></script>
</body>
</html>
